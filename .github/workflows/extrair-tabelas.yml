name: Extrair tabelas oficiais

on:
  workflow_dispatch: {}
  schedule:
    - cron: "37 11 * * 1"   # segunda-feira, 08:37 em Brasília (depois do monitor)

permissions:
  contents: write
  pull-requests: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Baixar documentos oficiais
        run: node scripts/baixar.mjs
      - name: Extrair tabelas
        run: if [ -f scripts/extrair.mjs ]; then node scripts/extrair.mjs; else echo "extrator ainda não criado"; fi
      - name: Abrir proposta de mudança se algo mudou
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "extrator-base-normativa"
          git config user.email "actions@users.noreply.github.com"
          ramo="extracao/$(date +%Y-%m-%d-%H%M)"
          git checkout -b "$ramo"
          git add fontes/bruto tabelas manifesto.json
          if git diff --cached --quiet; then echo "Nada mudou nas fontes nem nas tabelas."; exit 0; fi
          git commit -m "Extração automática das fontes oficiais em $(date +%Y-%m-%d)"
          git push -u origin "$ramo"
          corpo="Extração automática a partir dos documentos oficiais baixados em \`fontes/bruto/\` (veja \`fontes/bruto/registro.json\` com URL, data e hash).

          **Antes de aprovar:**
          - [ ] Conferir as tabelas extraídas com o documento oficial
          - [ ] Conferir se notas técnicas posteriores alteram algum código
          - [ ] Preencher versão, vigência e conferido por/em no manifesto
          - [ ] Atualizar o CHANGELOG"
          gh pr create --title "Extração das tabelas oficiais – $(date +%Y-%m-%d)" --body "$corpo" --base main --head "$ramo" || echo "Não foi possível abrir o PR automaticamente; o ramo $ramo está publicado."
