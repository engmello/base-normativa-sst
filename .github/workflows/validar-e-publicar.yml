name: Validar e publicar a base

on:
  push:
    branches: [main]
    paths-ignore: ["dist/**", "monitor/estado.json"]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar manifesto e dados
        run: node scripts/validar.mjs
      - name: Gerar dist
        run: node scripts/build.mjs
      - name: Publicar dist (só na main)
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "build-base-normativa"
          git config user.email "actions@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || git commit -m "dist: base $(node -p "require('./dist/versao.json').versao") [skip ci]"
          git push
