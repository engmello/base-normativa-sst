name: Monitorar fontes oficiais

on:
  schedule:
    - cron: "17 11 * * 1"   # toda segunda-feira, 08:17 em Brasília
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  monitorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verificar páginas oficiais
        run: node scripts/monitorar.mjs
      - name: Abrir issue se houver mudança
        if: hashFiles('monitor/relatorio.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create atualizacao-normativa --color D93F0B --description "Fonte oficial mudou" 2>/dev/null || true
          gh issue create --title "Possível atualização normativa – $(date +%Y-%m-%d)" \
            --label atualizacao-normativa --body-file monitor/relatorio.md
      - name: Guardar estado
        run: |
          git config user.name "monitor-base-normativa"
          git config user.email "actions@users.noreply.github.com"
          git add monitor/estado.json
          git diff --cached --quiet || git commit -m "monitor: estado das fontes em $(date +%Y-%m-%d) [skip ci]"
          git push
